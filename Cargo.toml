[package]
name = "brz-ds"
version = "0.0.4"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Shared low-level data structures used by Breeze components"
repository = "https://github.com/we-breeze/ds"
readme = "README.md"

[lib]
name = "brz_ds"

[dependencies]
mimalloc = { version = "0.1.34", default-features = false }
crossbeam-utils = "0.8"
tokio = { version = "1", features = ["io-util"], optional = true }

[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

[features]
default = ["heap-stats"]
heap-stats = []
tokio = ["dep:tokio"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
